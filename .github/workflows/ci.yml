name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The declared floor exactly (every package.json "engines": >=20.18.1,
        # set by undici in email-mcp), plus the current LTS lines. A bare "20"
        # resolves to the newest 20.x and would not catch a floor violation.
        node-version: ["20.18.1", 22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # `typecheck` is `tsc --noEmit`, so it does not exercise emit, the
      # Turborepo build graph, or the `chmod +x` on the CLI shims — all of
      # which the publish workflow depends on.
      - run: npm run build
      - run: npm test
