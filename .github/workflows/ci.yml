name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The declared floor exactly (every package.json "engines": >=20.19.0),
        # plus the current LTS lines. The servers need 20.18.1 (undici, in
        # email-mcp); the floor is 20.19.0 because the test toolchain (vite,
        # under vitest) supports nothing older, and a floor that cannot run the
        # tests is not one CI can check. A bare "20" would resolve to the newest
        # 20.x and not test the floor at all.
        node-version: ["20.19.0", 22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # `typecheck` is `tsc --noEmit`, so it does not exercise emit, the
      # Turborepo build graph, or the `chmod +x` on the CLI shims — all of
      # which the publish workflow depends on.
      - run: npm run build
      - run: npm test
