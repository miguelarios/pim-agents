name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The declared floor exactly (every package.json "engines": >=22.12.0),
        # plus the current LTS lines. Node 20 is past end of life; 22.12.0 is
        # the first 22.x the test toolchain (vite, under vitest) supports, and
        # a floor that cannot run the tests is not one CI can check. A bare
        # "22" would resolve to the newest 22.x and not test the floor at all.
        node-version: ["22.12.0", 22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # `typecheck` is `tsc --noEmit`, so it does not exercise emit, the
      # Turborepo build graph, or the `chmod +x` on the CLI shims — all of
      # which the publish workflow depends on.
      - run: npm run build
      - run: npm test
